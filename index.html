<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>さんすうチャレンジ30</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: linear-gradient(#9ee7ff, #fff4b8);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
    }

    .game {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 28px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        text-align: center;
    }

    h1 {
        margin-top: 5px;
        font-size: 30px;
    }

    .status {
        display: flex;
        justify-content: space-between;
        background: #f4f7ff;
        border-radius: 16px;
        padding: 12px 16px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .question-number {
        font-size: 20px;
        color: #555;
        margin-bottom: 12px;
    }

    .question {
        background: #fff9db;
        border-radius: 20px;
        padding: 20px 12px;
        font-size: 24px;
        line-height: 1.7;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .formula {
        font-size: 34px;
        font-weight: bold;
        margin-top: 15px;
    }

    #answer {
        width: 95px;
        height: 70px;
        font-size: 36px;
        font-weight: bold;
        text-align: center;
        border: 4px solid #4d96ff;
        border-radius: 12px;
        background: white;
        outline: none;
    }

    #answer:focus {
        border-color: #ff8c42;
        box-shadow: 0 0 0 4px rgba(255,140,66,0.18);
    }

    button {
        width: 100%;
        min-height: 62px;
        border: none;
        border-radius: 18px;
        font-size: 24px;
        font-weight: bold;
        margin-top: 18px;
        cursor: pointer;
        touch-action: manipulation;
    }

    #checkBtn {
        background: #4d96ff;
        color: white;
    }

    #nextBtn {
        display: none;
        background: #56c271;
        color: white;
    }

    #restartBtn {
        display: none;
        background: #ff9f43;
        color: white;
    }

    .result {
        min-height: 55px;
        margin-top: 16px;
        font-size: 25px;
        font-weight: bold;
    }

    .correct {
        color: #16a34a;
        animation: pop 0.35s;
    }

    .wrong {
        color: #e63946;
        animation: shake 0.35s;
    }

    .progress-bg {
        background: #e5e7eb;
        height: 16px;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 18px;
    }

    .progress {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #4d96ff, #6bcb77);
        transition: width 0.35s;
    }

    .finalScore {
        font-size: 54px;
        font-weight: bold;
        color: #ff8c42;
        margin: 20px 0;
    }

    @keyframes pop {
        0% { transform: scale(0.7); }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }
</style>
</head>

<body>

<div class="game">

    <h1>🧮 さんすうチャレンジ</h1>

    <div class="status">
        <span id="questionCount">1 / 30</span>
        <span>⭐ <span id="score">0</span></span>
    </div>

    <div class="progress-bg">
        <div class="progress" id="progress"></div>
    </div>

    <div id="gameArea">

        <div class="question-number" id="category">
            たし算
        </div>

        <div class="question">

            <div id="questionText">
                りんごが8こあります。<br>
                あとから7こもらいました。
            </div>

            <div class="formula">
